<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Cafe Ambience Gradients -->
    <linearGradient id="cafe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d22" />
      <stop offset="40%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#0b0c0f" />
    </linearGradient>

    <!-- Warm Bokeh Lights -->
    <radialGradient id="bokeh-warm-1" cx="20%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-warm-2" cx="32%" cy="25%" r="20%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-green" cx="80%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#047857" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="window-light" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Skin & Facial Gradients (Warm South Asian Skin Tone) -->
    <linearGradient id="skin-base" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#e2aa76" />
      <stop offset="50%" stop-color="#c88d59" />
      <stop offset="100%" stop-color="#a36b39" />
    </linearGradient>
    <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#995f31" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#693c18" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="skin-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7cb9e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#e2aa76" stop-opacity="0" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hair-main" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2d313c" />
      <stop offset="35%" stop-color="#1a1c23" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="hair-shine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#525866" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1a1c23" stop-opacity="0" />
    </linearGradient>

    <!-- Black Hoodie Texture & Folds -->
    <linearGradient id="hoodie-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242730" />
      <stop offset="40%" stop-color="#16181f" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>
    <linearGradient id="hoodie-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333745" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glasses Frame (Thin Metallic Wireframe) -->
    <linearGradient id="glasses-wire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="50%" stop-color="#4b5563" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" />
      <feOffset dx="2" dy="6" />
      <feComponentTransfer><feFuncA type="linear" slope="0.4" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background Layer (Café Atmosphere) -->
  <rect width="600" height="600" fill="url(#cafe-bg)" />
  
  <!-- Soft blurred background elements -->
  <circle cx="120" cy="100" r="140" fill="url(#bokeh-warm-1)" />
  <circle cx="210" cy="150" r="45" fill="url(#bokeh-warm-2)" opacity="0.7" />
  <circle cx="110" cy="220" r="30" fill="url(#bokeh-warm-2)" opacity="0.4" />
  <circle cx="480" cy="240" r="180" fill="url(#bokeh-green)" />
  <rect x="420" y="0" width="180" height="350" fill="url(#window-light)" />

  <!-- Background Plant Foliage Silhouettes -->
  <path d="M 50 260 Q 20 200 60 140 Q 100 200 50 260 Z" fill="#064e3b" opacity="0.25" />
  <path d="M 100 320 Q 40 250 110 180 Q 160 260 100 320 Z" fill="#047857" opacity="0.2" />
  <path d="M 520 220 Q 460 150 540 90 Q 580 170 520 220 Z" fill="#065f46" opacity="0.3" />

  <!-- 2. Black Hoodie Body (3/4 Turned Pose) -->
  <g id="body" filter="url(#soft-shadow)">
    <!-- Base Hoodie Shoulders & Chest -->
    <path d="M 130 600 C 130 460, 200 420, 310 420 C 430 420, 520 460, 520 600 Z" fill="url(#hoodie-base)" />
    
    <!-- Hood Collar & Shoulders fanning out -->
    <path d="M 210 435 C 260 480, 360 480, 420 435 C 450 510, 410 600, 310 600 C 210 600, 170 510, 210 435 Z" fill="#121318" />
    
    <!-- Hood Creases and Neckline -->
    <path d="M 225 430 Q 310 465 395 430 C 410 460, 380 490, 310 495 C 240 490, 210 460, 225 430 Z" fill="#1d2028" stroke="#0a0a0d" stroke-width="2" />
    
    <!-- Hoodie Strings -->
    <path d="M 270 455 C 268 510, 272 550, 275 580" stroke="#4b5563" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 345 455 C 347 510, 343 550, 340 580" stroke="#4b5563" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Metal String Aglets -->
    <rect x="273" y="575" width="4" height="12" rx="2" fill="#9ca3af" />
    <rect x="338" y="575" width="4" height="12" rx="2" fill="#9ca3af" />
  </g>

  <!-- 3. Neck & Throat -->
  <g id="neck">
    <path d="M 265 360 L 355 360 L 370 440 C 330 460, 290 460, 250 440 Z" fill="url(#skin-base)" />
    <!-- Neck Shadow under Jaw -->
    <path d="M 265 360 Q 320 400 370 360 Q 320 425 265 360 Z" fill="url(#skin-shadow)" />
  </g>

  <!-- 4. Head, Face & Features (3/4 Right View) -->
  <g id="head" filter="url(#soft-shadow)">
    <!-- Right Ear (Visible at 3/4 turn) -->
    <g id="ear-right">
      <ellipse cx="400" cy="295" rx="16" ry="26" fill="#c88d59" transform="rotate(10, 400, 295)" />
      <ellipse cx="400" cy="295" rx="9" ry="16" fill="#a36b39" transform="rotate(10, 400, 295)" />
    </g>

    <!-- Face Structure / Skin Base -->
    <path d="M 235 230 
             C 220 280, 225 330, 255 380 
             C 285 415, 340 425, 375 385 
             C 405 350, 410 295, 400 230 
             C 320 200, 260 210, 235 230 Z" 
          fill="url(#skin-base)" />

    <!-- Face Highlights & Contour Shadows -->
    <path d="M 235 230 C 220 280, 225 330, 255 380 C 240 330, 238 270, 250 230 Z" fill="url(#skin-shadow)" opacity="0.6" />
    <!-- Cheek Bone Highlight -->
    <path d="M 320 280 Q 360 270 380 290 Q 350 310 320 280 Z" fill="url(#skin-highlight)" opacity="0.5" />

    <!-- Nose Structure (3/4 angle) -->
    <path d="M 305 240 L 298 295 Q 306 308 318 300 Q 322 290 318 280 Z" fill="#b87c4a" />
    <path d="M 305 240 L 302 294 Q 308 300 314 295 L 312 280 Z" fill="#e2aa76" opacity="0.6" />
    <!-- Nostril -->
    <ellipse cx="304" cy="301" rx="4" ry="2.5" fill="#522f13" opacity="0.8" />

    <!-- Lips -->
    <path d="M 285 335 Q 310 330 332 336 Q 310 350 285 335 Z" fill="#9e563a" />
    <path d="M 292 335 Q 310 332 325 336" stroke="#6e3722" stroke-width="2" fill="none" />

    <!-- 5. Neatly Trimmed Beard & Mustache -->
    <g id="facial-hair">
      <!-- Mustache -->
      <path d="M 280 322 Q 308 314 335 324 Q 328 335 308 332 Q 288 335 280 322 Z" fill="#14151a" />
      <!-- Jawline & Chin Beard -->
      <path d="M 235 280 
               C 230 340, 260 405, 318 410 
               C 365 408, 395 360, 402 300 
               C 394 350, 360 398, 318 400 
               C 265 395, 240 340, 238 280 Z" 
            fill="#14151a" />
      <!-- Soul Patch under lip -->
      <polygon points="303,342 313,342 310,354 306,354" fill="#14151a" />
    </g>

    <!-- 6. Eyes & Eyebrows (Looking slightly left) -->
    <g id="eyes">
      <!-- Left Eyebrow -->
      <path d="M 245 238 Q 272 230 295 240" stroke="#121318" stroke-width="8" stroke-linecap="round" fill="none" />
      <!-- Right Eyebrow -->
      <path d="M 322 240 Q 348 232 378 242" stroke="#121318" stroke-width="8" stroke-linecap="round" fill="none" />

      <!-- Left Eye -->
      <ellipse cx="270" cy="258" rx="14" ry="9" fill="#ffffff" />
      <circle cx="268" cy="258" r="6.5" fill="#1e1815" />
      <circle cx="266" cy="256" r="2" fill="#ffffff" />

      <!-- Right Eye -->
      <ellipse cx="348" cy="260" rx="15" ry="9.5" fill="#ffffff" />
      <circle cx="345" cy="260" r="7" fill="#1e1815" />
      <circle cx="343" cy="258" r="2.2" fill="#ffffff" />
    </g>

    <!-- 7. Thin Dark Round/Oval Wire-Frame Glasses -->
    <g id="glasses">
      <!-- Left Lens Frame -->
      <ellipse cx="270" cy="258" rx="28" ry="22" fill="none" stroke="url(#glasses-wire)" stroke-width="3" />
      <!-- Right Lens Frame -->
      <ellipse cx="348" cy="260" rx="29" ry="23" fill="none" stroke="url(#glasses-wire)" stroke-width="3" />
      <!-- Bridge -->
      <path d="M 298 253 Q 310 248 319 253" fill="none" stroke="url(#glasses-wire)" stroke-width="3" stroke-linecap="round" />
      <!-- Frame Arm to Right Ear -->
      <path d="M 377 258 L 402 278" fill="none" stroke="url(#glasses-wire)" stroke-width="2.5" />
      <path d="M 242 258 L 232 255" fill="none" stroke="url(#glasses-wire)" stroke-width="2" />
      <!-- Subtle Lens Glare -->
      <path d="M 252 244 Q 270 240 282 246" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none" />
      <path d="M 330 246 Q 348 242 362 248" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none" />
    </g>

    <!-- 8. Stylish Dark Voluminous Hair (Wavy / Textured Top) -->
    <g id="hair">
      <!-- Main Hair Mass -->
      <path d="M 220 240 
               C 200 180, 220 110, 270 85 
               C 320 60, 390 70, 420 110 
               C 440 145, 435 200, 412 245 
               C 395 200, 385 180, 365 185 
               C 335 160, 290 150, 255 170 
               C 235 185, 225 210, 220 240 Z" 
            fill="url(#hair-main)" />

      <!-- Wavy Hair Locks & Texture Strands -->
      <path d="M 235 180 C 265 120, 320 100, 375 115" stroke="#434956" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7" />
      <path d="M 260 135 C 295 90, 350 85, 400 125" stroke="#5a6273" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6" />
      <path d="M 225 210 C 240 160, 280 140, 310 150" stroke="#333842" stroke-width="6" stroke-linecap="round" fill="none" />
      <path d="M 300 105 C 340 80, 390 95, 415 135" stroke="#434956" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />

      <!-- Sideburns -->
      <path d="M 395 240 L 392 285 L 385 285 Z" fill="#14151a" />
      <path d="M 230 235 L 228 265 L 235 265 Z" fill="#14151a" />
    </g>
  </g>
</svg>
