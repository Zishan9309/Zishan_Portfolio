<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad-ang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="card-grad-ang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-ang)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- App Header Banner -->
  <rect x="40" y="30" width="720" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="75" cy="60" r="18" fill="url(#accent-orange)"/>
  <!-- Mother & child icon placeholder -->
  <path d="M 70 55 A 5 5 0 1 1 80 55 A 5 5 0 1 1 70 55 Z M 66 68 C 66 62 84 62 84 68 Z" fill="#ffffff"/>
  <text x="105" y="56" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Anganwadi Support Mobile Platform</text>
  <text x="105" y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Poshan Tracker • Groq Llama-3 AI Assistant • SMS Vaccination</text>

  <rect x="610" y="46" width="130" height="28" rx="14" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
  <text x="675" y="64" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">● LIVE SYSTEM</text>

  <!-- Left: Mobile Device Screen Mockup -->
  <g transform="translate(60, 110)">
    <!-- Device Frame -->
    <rect width="210" height="310" rx="24" fill="#090d16" stroke="#475569" stroke-width="3"/>
    <rect x="65" y="8" width="80" height="12" rx="6" fill="#1e293b"/>
    
    <!-- Screen Content -->
    <rect x="12" y="28" width="186" height="270" rx="14" fill="#0f172a"/>
    
    <!-- Greeting Card in App -->
    <rect x="22" y="38" width="166" height="48" rx="8" fill="url(#accent-orange)" fill-opacity="0.15" stroke="#f97316" stroke-width="0.8"/>
    <text x="32" y="56" fill="#fdba74" font-family="system-ui, sans-serif" font-size="10" font-weight="700">नमस्ते! Anganwadi Sevikas</text>
    <text x="32" y="72" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="8">18 Beneficiaries Registered Today</text>

    <!-- Vaccination Alert -->
    <rect x="22" y="94" width="166" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
    <circle cx="38" cy="115" r="8" fill="#10b981"/>
    <text x="52" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="600">Polio & BCG Drive</text>
    <text x="52" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5">Auto-SMS Alert Dispatched</text>

    <!-- AI Chatbot Box -->
    <rect x="22" y="144" width="166" height="74" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
    <text x="32" y="160" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Groq AI (Llama-3) Query</text>
    <rect x="30" y="168" width="150" height="20" rx="4" fill="#312e81"/>
    <text x="36" y="181" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="7.5">"PMMVY scheme benefits eligibility?"</text>
    <rect x="30" y="192" width="150" height="20" rx="4" fill="#1e293b"/>
    <text x="36" y="204" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="7.5">✓ Instant Hindi/English response generated</text>

    <!-- Bottom Nav -->
    <rect x="22" y="226" width="166" height="30" rx="6" fill="#1e293b"/>
    <circle cx="45" cy="241" r="5" fill="#38bdf8"/>
    <circle cx="85" cy="241" r="5" fill="#64748b"/>
    <circle cx="125" cy="241" r="5" fill="#64748b"/>
    <circle cx="165" cy="241" r="5" fill="#64748b"/>
  </g>

  <!-- Right: Architecture & Impact Cards -->
  <g transform="translate(300, 110)">
    <!-- Card 1: Child Nutrition & Health Tracking -->
    <rect width="460" height="92" rx="12" fill="url(#card-grad-ang)" stroke="#334155" stroke-width="1"/>
    <rect x="18" y="16" width="40" height="40" rx="10" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="38" y="41" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">01</text>
    <text x="72" y="34" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Digital Child Growth & Immunization Records</text>
    <text x="72" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replaces physical paper registers with encrypted MongoDB record store & instant search.</text>
    <rect x="72" y="64" width="90" height="18" rx="4" fill="#0369a1" fill-opacity="0.3"/>
    <text x="117" y="77" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">React Native</text>
    <rect x="170" y="64" width="70" height="18" rx="4" fill="#047857" fill-opacity="0.3"/>
    <text x="205" y="77" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Node.js</text>
    <rect x="248" y="64" width="80" height="18" rx="4" fill="#4338ca" fill-opacity="0.3"/>
    <text x="288" y="77" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">MongoDB</text>

    <!-- Card 2: Groq Llama-3 AI Multilingual Assistance -->
    <rect y="108" width="460" height="92" rx="12" fill="url(#card-grad-ang)" stroke="#4338ca" stroke-width="1"/>
    <rect x="18" y="124" width="40" height="40" rx="10" fill="#4f46e5" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="38" y="149" fill="#818cf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AI</text>
    <text x="72" y="142" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Groq AI (Llama-3) Scheme Guidance Engine</text>
    <text x="72" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Empowers rural health workers with instant voice/text answers in Hindi and English.</text>
    <rect x="72" y="172" width="115" height="18" rx="4" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="129" y="185" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Groq Cloud API</text>
    <rect x="195" y="172" width="95" height="18" rx="4" fill="#d97706" fill-opacity="0.3"/>
    <text x="242" y="185" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Llama-3 8B</text>

    <!-- Card 3: Real-Time SMS Reminders & Verification -->
    <rect y="216" width="460" height="92" rx="12" fill="url(#card-grad-ang)" stroke="#334155" stroke-width="1"/>
    <rect x="18" y="232" width="40" height="40" rx="10" fill="#059669" fill-opacity="0.2" stroke="#34d399" stroke-width="1"/>
    <text x="38" y="257" fill="#34d399" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">SMS</text>
    <text x="72" y="250" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Automated SMS Reminders & Verification Alerts</text>
    <text x="72" y="268" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Reduces missed vaccination rates by sending automated scheduled notifications to parents.</text>
    <rect x="72" y="280" width="105" height="18" rx="4" fill="#047857" fill-opacity="0.3"/>
    <text x="124" y="293" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Twilio / SMS Gateway</text>
    <rect x="185" y="280" width="95" height="18" rx="4" fill="#0284c7" fill-opacity="0.3"/>
    <text x="232" y="293" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Parent Verification</text>
  </g>
</svg>
